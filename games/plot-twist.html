<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Plot Twist</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: same graph-paper workbench as the rest of the series. Here the page's own grid paper
   becomes the playing field: a live coordinate plane you tap to plot.
   blue = your marks, green = correct, amber = triangle legs / targets, rose = misses. */
:root{
  --paper:#eef3f6; --grid:#dbe4eb; --card:#ffffff; --ink:#17222d; --muted:#556472; --line:#c7d3dd;
  --sq:#2c5cc9; --sq-soft:#dce6fb; --lin:#1b845a; --lin-soft:#d5efe2;
  --unit:#b9770a; --unit-soft:#fcecc9; --neg:#c3364d; --neg-soft:#f8dce1;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"STIX Two Text","Cambria","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f151b; --grid:#18212a; --card:#162029; --ink:#e3eaf0; --muted:#98a7b4; --line:#2b3a47;
    --sq:#80a6ff; --sq-soft:#1e2d52; --lin:#4fcf95; --lin-soft:#153a2a;
    --unit:#f1b54a; --unit-soft:#3d2e12; --neg:#ff8094; --neg-soft:#4a1d27; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f151b; --grid:#18212a; --card:#162029; --ink:#e3eaf0; --muted:#98a7b4; --line:#2b3a47;
  --sq:#80a6ff; --sq-soft:#1e2d52; --lin:#4fcf95; --lin-soft:#153a2a;
  --unit:#f1b54a; --unit-soft:#3d2e12; --neg:#ff8094; --neg-soft:#4a1d27; color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,6vw,3.2rem);letter-spacing:-.025em;line-height:1;margin:0}
h1 .dot{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--neg);margin:0 .08em .06em;vertical-align:baseline}
h1 .tw{color:var(--sq)}
.sub{margin:10px 0 0;color:var(--muted);max-width:62ch}
.total{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 14px}
.tot-n{font-size:1.8rem;font-weight:800;color:var(--unit);font-variant-numeric:tabular-nums}
.tot-of{color:var(--muted);font-size:.9rem}
.rail-wrap{overflow-x:auto;padding:4px;margin:-4px}
.rail{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.st-btn{width:100%;height:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;display:grid;gap:1px;align-content:start}
.st-btn:hover{border-color:var(--sq)}
.st-btn[aria-current="true"]{border-color:var(--sq);box-shadow:0 0 0 3px var(--sq-soft)}
.st-num{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.st-name{font-family:var(--f-display);font-weight:600;font-size:1.02rem;line-height:1.2}
.st-topic{font-size:.82rem;color:var(--muted)}
.st-stars{color:var(--unit);letter-spacing:2px;font-size:.95rem;margin-top:4px}
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:clamp(16px,3.2vw,30px);display:grid;gap:16px;min-width:0}
.stage-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{margin:0;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,4vw,2rem);margin:2px 0 0;letter-spacing:-.015em;text-wrap:balance}
.dots{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.dots li{min-width:34px;height:30px;padding:0 6px;border-radius:15px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dots li.now{border-color:var(--sq);color:var(--sq);font-weight:700}
.dots li.done{background:var(--unit-soft);border-color:var(--unit);color:var(--unit);letter-spacing:-1px}
.prompt{font-size:1.08rem;max-width:72ch}
.prompt p{margin:0}
.m{font-family:var(--f-math);font-size:1.18em;white-space:nowrap}
.m i{font-style:italic}
.m .m{font-size:1em}
sup{font-size:.68em;line-height:0}
.frac{display:inline-grid;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.3}
.frac>.fn{padding:0 .25em .06em}
.frac>.fd{border-top:1.5px solid currentColor;padding:.06em .25em 0}
.rad{border-top:1.5px solid currentColor;padding:0 .1em}
.lbl{margin:0 0 6px;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.play{display:grid;gap:16px;min-width:0}
.fb{min-height:1.6em;font-size:1.02rem;padding:10px 14px;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted);overflow-x:auto}
.fb:empty{border-color:transparent;padding-block:0;min-height:0}
.fb.good{border:1.5px solid var(--lin);background:var(--lin-soft);color:var(--ink)}
.fb.bad{border:1.5px solid var(--neg);background:var(--neg-soft);color:var(--ink)}
.fb-stars{color:var(--unit);letter-spacing:2px;margin-right:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions:empty{display:none}
.btn{font:inherit;font-weight:700;border-radius:9px;padding:10px 18px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--card)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--sq);outline-offset:2px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.shake{animation:none!important}}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.steps>li{border-left:3px solid var(--line);padding:2px 0 2px 14px;display:grid;gap:8px;min-width:0}
.steps>li.on{border-left-color:var(--sq)}
.steps>li.ok{border-left-color:var(--lin)}
.steps p{margin:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;padding:8px 16px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sq)}
.opt.miss{border-color:var(--neg);background:var(--neg-soft)}
.opt.hit{border-color:var(--lin);background:var(--lin-soft)}
.opt:disabled{cursor:default}
.work{overflow-x:auto}

/* coordinate grid */
.gridwrap{display:flex;justify-content:center;min-width:0}
svg.grid{width:100%;max-width:460px;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
svg.grid.picking{cursor:crosshair}
svg.grid .gl{stroke:var(--line);stroke-width:1}
svg.grid .ax{stroke:var(--ink);stroke-width:1.8}
svg.grid .tk{font:11px var(--f-body);fill:var(--muted)}
svg.grid .axl{font:italic 15px var(--f-math);fill:var(--ink)}
svg.grid .pt{fill:var(--sq);stroke:var(--card);stroke-width:2}
svg.grid .pt.good{fill:var(--lin)}
svg.grid .pt.bad{fill:var(--neg)}
svg.grid .pt.target{fill:var(--unit)}
svg.grid .plab{font:700 13px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
svg.grid .plab.leg{fill:var(--unit)}
svg.grid .tag rect{fill:var(--unit-soft);stroke:var(--unit);stroke-width:1.8}
svg.grid .tag text{font:700 15px var(--f-body);fill:var(--ink);font-variant-numeric:tabular-nums}
svg.grid .ln{stroke:var(--sq);stroke-width:2.6;fill:none}
svg.grid .ln.good{stroke:var(--lin)}
svg.grid .seg{stroke:var(--sq);stroke-width:2.6}
svg.grid .leg{stroke:var(--unit);stroke-width:2.4;stroke-dasharray:6 4}
svg.grid .guide{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 4}
svg.grid .ra{fill:none;stroke:var(--unit);stroke-width:1.6}
svg.grid .circ{fill:none;stroke:var(--lin);stroke-width:2.4}
svg.grid .ghost circle{fill:none;stroke:var(--sq);stroke-width:2}
svg.grid .ghost text{font:700 12px var(--f-body);fill:var(--sq);paint-order:stroke;stroke:var(--card);stroke-width:4px}

table.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{padding:6px 14px;border-bottom:1px solid var(--line);text-align:left}
table.tbl th{font-weight:400;color:var(--muted)}
table.tbl tr.now td{background:var(--sq-soft)}
table.tbl tr.done td{color:var(--lin)}

/* speed */
.speed{display:grid;gap:14px;justify-items:center;text-align:center}
.timer{width:100%;height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.timer .bar{height:100%;width:100%;background:var(--sq);transform-origin:left;transition:transform .1s linear}
.speed-top{width:100%;display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.claim{font-size:clamp(1.8rem,7vw,2.8rem);margin:0}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.choice{font:inherit;font-weight:700;padding:14px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--sq)}
.choice:disabled{opacity:.5;cursor:default}
kbd{font-family:var(--f-body);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
@media (max-width:480px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}}

.summary{display:grid;gap:10px;justify-items:start}
.bigstars{font-size:3rem;color:var(--unit);letter-spacing:6px;margin:0;line-height:1}
.summary p{margin:0;max-width:60ch}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--muted);font-size:.85rem}
.linkbtn{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Plot<span class="dot" aria-hidden="true"></span><span class="tw">Twist</span></h1>
      <p class="sub">A coordinate-plane game for Math 115, Section 2.1. Tap the grid to plot points, find intercepts, build right triangles, and find midpoints. Six stations: a clean round earns three stars, and each slip costs one.</p>
    </div>
    <div class="total" id="total" aria-live="polite"></div>
  </header>
  <nav class="rail-wrap" aria-label="Stations"><ol class="rail" id="rail"></ol></nav>
  <main class="stage" id="stage"></main>
  <footer>
    <span>Stars are saved in this browser only.</span>
    <button class="linkbtn" id="reset" type="button">Reset stars</button>
  </footer>
</div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const nz=n=>{let v=0;while(!v)v=rnd(-n,n);return v;};
const MINUS="−";
const sup=e=>`<sup>${e}</sup>`;
const M=h=>`<span class="m">${h}</span>`;
const fracH=(n,d)=>d==="1"?n:`<span class="frac"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
const starStr=n=>"★".repeat(n)+"☆".repeat(3-n);
const num=v=>(v<0?MINUS:"")+Math.abs(v);
const pn=v=>v<0?`(${num(v)})`:num(v);
const R=(n,d=1)=>{if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;return {n:n/g,d:d/g};};
const rS=r=>r.d===1?num(r.n):(r.n<0?MINUS:"")+fracH(String(Math.abs(r.n)),String(r.d));
const X="<i>x</i>",Y="<i>y</i>";
function termV(c,v,first){const a=Math.abs(c),body=(a===1&&v)?v:(a+v);if(first)return (c<0?MINUS:"")+body;return (c<0?` ${MINUS} `:" + ")+body;}
function coefX(m){if(m.n===0)return "";if(m.d===1)return termV(m.n,X,true);return (m.n<0?MINUS:"")+fracH(String(Math.abs(m.n)),String(m.d))+X;}
function siRHS(m,b){const mx=coefX(m);if(b.n===0)return mx||"0";if(!mx)return rS(b);return mx+(b.n<0?` ${MINUS} `:" + ")+rS(R(Math.abs(b.n),b.d));}
function eqStd(A,B,C){let s="",f=true;if(A){s+=termV(A,X,true);f=false;}if(B)s+=termV(B,Y,f);return s+" = "+num(C);}
const coordTxt=(x,y)=>`(${num(x)}, ${num(y)})`;
const radS=n=>{const s=Math.round(Math.sqrt(n));return s*s===n?String(s):`√<span class="rad">${n}</span> ≈ ${Math.sqrt(n).toFixed(2)}`;};

/* ---------- coordinate grid ---------- */
const SVGNS="http://www.w3.org/2000/svg";let gridSeq=0;
function makeGrid(host,o){
  const xmin=o.xmin,xmax=o.xmax,ymin=o.ymin,ymax=o.ymax,U=o.U||26,pad=22,snap=o.snap||1,tick=o.tick||2;
  const W=(xmax-xmin)*U+2*pad,H=(ymax-ymin)*U+2*pad;
  const X=x=>pad+(x-xmin)*U,Y=y=>pad+(ymax-y)*U;
  const cid="clip"+(++gridSeq);
  let h=`<div class="gridwrap"><svg class="grid" viewBox="0 0 ${W} ${H}" role="img" aria-label="Coordinate grid from ${xmin} to ${xmax}"><defs><clipPath id="${cid}"><rect x="${X(xmin)}" y="${Y(ymax)}" width="${(xmax-xmin)*U}" height="${(ymax-ymin)*U}"/></clipPath></defs><g>`;
  for(let x=xmin;x<=xmax;x++)h+=`<line class="gl" x1="${X(x)}" y1="${Y(ymin)}" x2="${X(x)}" y2="${Y(ymax)}"/>`;
  for(let y=ymin;y<=ymax;y++)h+=`<line class="gl" x1="${X(xmin)}" y1="${Y(y)}" x2="${X(xmax)}" y2="${Y(y)}"/>`;
  h+=`<line class="ax" x1="${X(xmin)}" y1="${Y(0)}" x2="${X(xmax)}" y2="${Y(0)}"/><line class="ax" x1="${X(0)}" y1="${Y(ymin)}" x2="${X(0)}" y2="${Y(ymax)}"/>`;
  for(let x=xmin;x<=xmax;x++)if(x&&x%tick===0)h+=`<text class="tk" x="${X(x)}" y="${Y(0)+14}" text-anchor="middle">${num(x)}</text>`;
  for(let y=ymin;y<=ymax;y++)if(y&&y%tick===0)h+=`<text class="tk" x="${X(0)-5}" y="${Y(y)+4}" text-anchor="end">${num(y)}</text>`;
  h+=`<text class="axl" x="${X(xmax)-4}" y="${Y(0)-7}" text-anchor="end">x</text><text class="axl" x="${X(0)+7}" y="${Y(ymax)+14}">y</text>`;
  h+=`</g><g clip-path="url(#${cid})" class="L-shapes"></g><g class="L-pts"></g><g class="ghost"></g></svg></div>`;
  host.innerHTML=h;
  const svg=host.querySelector("svg"),shapes=svg.querySelector(".L-shapes"),pts=svg.querySelector(".L-pts"),ghost=svg.querySelector(".ghost");
  let pickCb=null;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function at(e){
    const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width,sy=(e.clientY-r.top)*H/r.height;
    const x=clamp(Math.round((xmin+(sx-pad)/U)/snap)*snap,xmin,xmax),y=clamp(Math.round((ymax-(sy-pad)/U)/snap)*snap,ymin,ymax);
    return {x:x||0,y:y||0};
  }
  svg.addEventListener("pointermove",e=>{
    if(!pickCb){ghost.innerHTML="";return;}
    const p=at(e),right=X(p.x)>W-90;
    ghost.innerHTML=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="8"/><text x="${X(p.x)+(right?-11:11)}" y="${Y(p.y)-11}" text-anchor="${right?"end":"start"}">${coordTxt(p.x,p.y)}</text>`;
  });
  svg.addEventListener("pointerleave",()=>{ghost.innerHTML="";});
  svg.addEventListener("click",e=>{if(!pickCb)return;const p=at(e);pickCb(p.x,p.y);});
  const add=(layer,s)=>{const g=document.createElementNS(SVGNS,"g");g.innerHTML=s;layer.appendChild(g);return g;};
  const api={
    pick(cb){pickCb=cb;svg.classList.toggle("picking",!!cb);if(!cb)ghost.innerHTML="";},
    point(x,y,cls="",label="",pos="ne"){
      const w=pos.includes("w"),s=pos.includes("s");
      let t=`<circle class="pt ${cls}" cx="${X(x)}" cy="${Y(y)}" r="6.5"/>`;
      if(label)t+=`<text class="plab" x="${X(x)+(w?-10:10)}" y="${Y(y)+(s?19:-10)}" text-anchor="${w?"end":"start"}">${label}</text>`;
      return add(pts,t);
    },
    text(x,y,str,cls="plab",anchor="middle",dy=0){return add(pts,`<text class="${cls}" x="${X(x)}" y="${Y(y)+dy}" text-anchor="${anchor}">${str}</text>`);},
    line(x1,y1,x2,y2,cls=""){
      let a,b,c,d;
      if(x1===x2){a=c=x1;b=ymin-1;d=ymax+1;}else{const m=(y2-y1)/(x2-x1);a=xmin-1;c=xmax+1;b=y1+m*(a-x1);d=y1+m*(c-x1);}
      return add(shapes,`<line class="ln ${cls}" x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}"/>`);
    },
    seg(x1,y1,x2,y2,cls="seg"){return add(shapes,`<line class="${cls}" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"/>`);},
    circle(cx,cy,r){return add(shapes,`<circle class="circ" cx="${X(cx)}" cy="${Y(cy)}" r="${r*U}"/>`);},
    tag(x,y,str,side){
      const w=str.length*8.6+18,h=26,gap=10;
      let cx=X(x),cy=Y(y);
      if(side==="l")cx-=w/2+gap;else if(side==="r")cx+=w/2+gap;else if(side==="u")cy-=h/2+gap;else cy+=h/2+gap;
      cx=Math.max(w/2+2,Math.min(W-w/2-2,cx));cy=Math.max(h/2+2,Math.min(H-h/2-2,cy));
      return add(pts,`<g class="tag"><rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="7"/><text x="${cx}" y="${cy+5}" text-anchor="middle">${str}</text></g>`);
    },
    rightAngle(cx,cy,tx,ty){
      const sx=Math.sign(tx-cx)*.45,sy=Math.sign(ty-cy)*.45;
      return add(shapes,`<polyline class="ra" points="${X(cx+sx)},${Y(cy)} ${X(cx+sx)},${Y(cy+sy)} ${X(cx)},${Y(cy+sy)}"/>`);
    }
  };
  return api;
}

/* ---------- UI helpers ---------- */
function addStep(label,body){
  const ol=$("#steps");ol.querySelectorAll("li.on").forEach(l=>{l.className="ok";});
  const li=document.createElement("li");li.className="on";li.innerHTML=`<p class="lbl">${label}</p>${body}`;
  ol.appendChild(li);return li;
}
function choose(host,items,onOK,mix=true){
  const list=mix?shuffle(items.slice()):items.slice();
  host.innerHTML=list.map((it,i)=>`<button type="button" class="opt" data-i="${i}">${it.h}</button>`).join("");
  host.addEventListener("click",e=>{
    const b=e.target.closest(".opt");if(!b||b.disabled)return;
    const it=list[+b.dataset.i];
    if(it.ok){b.classList.add("hit");host.querySelectorAll(".opt").forEach(x=>{x.disabled=true;});onOK();}
    else{b.classList.add("miss");b.disabled=true;ctx.miss(it.why);}
  });
}
const flash=g=>setTimeout(()=>g.remove(),900);

/* ---------- shell ---------- */
const store={
  get(){try{return JSON.parse(localStorage.getItem("plot-twist-stars")||"{}")||{};}catch(e){return {};}},
  set(o){try{localStorage.setItem("plot-twist-stars",JSON.stringify(o));}catch(e){}}
};
let best=store.get();
const S={st:0,round:0,mistakes:0,roundStars:[],cleanup:null,key:null};
function renderNav(){

  const tot=STATIONS.reduce((s,_,i)=>s+(best[i]||0),0);
  $("#total").innerHTML=`<span class="tot-n">${tot}</span><span class="tot-of">of ${STATIONS.length*3} stars</span>`;
}
function teardown(){if(S.cleanup){S.cleanup();S.cleanup=null;}S.key=null;}
function loadStation(i){teardown();S.st=i;S.round=0;S.roundStars=[];renderNav();startRound();}
function startRound(){
  teardown();S.mistakes=0;
  const st=STATIONS[S.st];
  $("#stage").innerHTML=`<div class="stage-head"><div><p class="eyebrow">Station ${S.st+1} · ${st.sec}</p><h2>${st.name}</h2></div>${st.rounds>1?`<ol class="dots" id="dots" aria-label="Round progress"></ol>`:""}</div>
  <div class="prompt" id="prompt"></div><div class="play" id="play"></div><div class="fb" id="fb" aria-live="polite"></div><div class="actions" id="actions"></div>`;

}
function renderDots(){
  const d=$("#dots");if(!d)return;let h="";
  for(let i=0;i<STATIONS[S.st].rounds;i++){const s=S.roundStars[i];h+=`<li class="${s?"done":i===S.round?"now":""}" aria-label="Round ${i+1}${s?`: ${s} stars`:""}">${s?"★".repeat(s):i+1}</li>`;}
  d.innerHTML=h;
}
const ctx={
  prompt(h){$("#prompt").innerHTML=h;},
  play(){return $("#play");},
  say(h,k=""){const f=$("#fb");if(!f)return;f.className="fb"+(k?" "+k:"");f.innerHTML=h;},
  miss(h){S.mistakes++;ctx.say(h,"bad");const p=$("#play");if(!p)return;p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");},
  win(h){
    const s=S.mistakes===0?3:S.mistakes===1?2:1;S.roundStars[S.round]=s;renderDots();
    ctx.say(`<span class="fb-stars" aria-label="${s} stars">${starStr(s)}</span>${h}`,"good");
    const last=S.round>=STATIONS[S.st].rounds-1;
    $("#actions").innerHTML=`<button type="button" class="btn primary" id="next">${last?"See results":"Next round"} →</button>`;

      else startRound();
    };
    $("#next").focus({preventScroll:true});
  }
};
function finish(n,detail){
  teardown();
  const i=S.st;if(n>(best[i]||0)){best[i]=n;store.set(best);}
  renderNav();
  const nx=(i+1)%STATIONS.length;
  $("#stage").innerHTML=`<div class="summary"><p class="eyebrow">Station ${i+1} complete</p><h2>${STATIONS[i].name}</h2>
  <p class="bigstars" aria-label="${n} of 3 stars">${starStr(n)}</p><p>${detail}</p>
  <div class="actions"><button type="button" class="btn" id="again">Play again</button><button type="button" class="btn primary" id="go">Station ${nx+1}: ${STATIONS[nx].name} →</button></div></div>`;
  $("#again").onclick=()=>loadStation(i);
  $("#go").onclick=()=>loadStation(nx);
}

/* ---------- Station 1: plot + quadrant (Ex 1) ---------- */
function quadOf(x,y){if(x===0)return "y-axis";if(y===0)return "x-axis";return x>0?(y>0?"I":"IV"):(y>0?"II":"III");}
const QLABEL={I:"Quadrant I",II:"Quadrant II",III:"Quadrant III",IV:"Quadrant IV","x-axis":"On the x-axis","y-axis":"On the y-axis"};
const locStr=p=>{const q=quadOf(p.x,p.y);return q.includes("axis")?`is on the ${q}`:`is in Quadrant ${q}`;};
function plotMsg(p,x,y){
  if(x===p.y&&y===p.x)return `You plotted ${M(coordTxt(x,y))}, with the coordinates swapped. The first number is ${M(X)} (left or right), the second is ${M(Y)} (up or down).`;
  if(x===-p.x&&y===p.y&&p.x)return `Check the sign of ${M(X)}: ${M(X+" = "+num(p.x))} means move ${p.x<0?"left":"right"} ${Math.abs(p.x)}.`;
  if(y===-p.y&&x===p.x&&p.y)return `Check the sign of ${M(Y)}: ${M(Y+" = "+num(p.y))} means move ${p.y<0?"down":"up"} ${Math.abs(p.y)}.`;
  if(x===-p.x&&y===-p.y)return "Both signs are flipped. Negative x is left, negative y is down.";
  return `That's ${M(coordTxt(x,y))}. Start at the origin: move ${M(X)} first (left or right), then ${M(Y)} (up or down).`;
}
function quadWhy(p){
  const q=quadOf(p.x,p.y);
  if(q.includes("axis"))return `${M(coordTxt(p.x,p.y))} has ${p.x===0?M(X+" = 0")+", so it sits on the y-axis":M(Y+" = 0")+", so it sits on the x-axis"}. Points on an axis are not in any quadrant.`;
  return `${M(X)} is ${p.x>0?"positive":"negative"} and ${M(Y)} is ${p.y>0?"positive":"negative"}. The sign pattern ${M(`(${p.x>0?"+":MINUS}, ${p.y>0?"+":MINUS})`)} is Quadrant ${q}.`;
}
const S1={
  name:"Drop Zone",sec:"Plotting points",rounds:5,
  gen(r){for(;;){let x=nz(6),y=nz(6);if(r>=1&&Math.random()<.35){if(Math.random()<.5)x=0;else y=0;}if(x!==y)return {x,y};}},
  round(r){
    const P=[this.gen(r)];let q;do{q=this.gen(r);}while(q.x===P[0].x&&q.y===P[0].y);P.push(q);
    let i=0;
    ctx.prompt(`<p>Plot ${M(coordTxt(P[0].x,P[0].y))} and ${M(coordTxt(P[1].x,P[1].y))}, then say where each one lies.</p>`);
    ctx.play().innerHTML=`<div class="split"><div id="gh"></div><ol class="steps" id="steps"></ol></div>`;
    const G=makeGrid($("#gh"),{xmin:-7,xmax:7,ymin:-7,ymax:7});
    const ask=()=>{
      const p=P[i];
      addStep(`Point ${i+1} of 2 · Plot it`,`<p>Tap the grid at ${M(coordTxt(p.x,p.y))}.</p>`);
      G.pick((x,y)=>{
        if(x===p.x&&y===p.y){
          G.pick(null);
          if(x&&y){G.seg(x,0,x,y,"guide");G.seg(0,y,x,y,"guide");}
          G.point(x,y,"good",coordTxt(x,y),(x<0?"w":"e")+(y<0?"s":"n"));ctx.say("");classify(p);
        }else{flash(G.point(x,y,"bad"));ctx.miss(plotMsg(p,x,y));}
      });
    };
    const classify=p=>{
      const ans=quadOf(p.x,p.y);
      const li=addStep(`Point ${i+1} of 2 · Where is it?`,`<div class="opts"></div>`);
      choose($(".opts",li),["I","II","III","IV","x-axis","y-axis"].map(k=>({h:QLABEL[k],ok:k===ans,why:quadWhy(p)})),()=>{
        i++;
        if(i<2)ask();
        else ctx.win(P.map(p=>`${M(coordTxt(p.x,p.y))} ${locStr(p)}.`).join(" "));
      },false);
    };
    ask();
  }
};

/* ---------- Station 2: graph by plotting points (Ex 2) ---------- */
const S2={
  name:"Table Run",sec:"Graphing by plotting points",rounds:5,
  gen(r){
    for(;;){
      const b=rnd(-3,3);let m;
      if(r===0)m=R(pick([1,2,3]));else if(r===1)m=R(pick([-1,-2,-3]));else if(r===2)m=R(pick([2,-2,3,-3]));
      else if(r===3)m=R(pick([1,-1]),2);else m=R(pick([3,-3]),2);
      const xs=r>=3?[-4,-2,0,2,4]:[-2,-1,0,1,2],ys=xs.map(x=>m.n*x/m.d+b);
      if(ys.every(y=>Math.abs(y)<=9))return {m,b,xs,ys};
    }
  },
  round(r){
    const {m,b,xs,ys}=this.gen(r),rhs=siRHS(m,R(b));
    const mc=m.d===1?(m.n===1?"":m.n===-1?MINUS:num(m.n)):((m.n<0?MINUS:"")+fracH(String(Math.abs(m.n)),String(m.d)));
    const sub=x=>`${mc}(${num(x)})${b?(b<0?` ${MINUS} ${-b}`:` + ${b}`):""}`;
    ctx.prompt(`<p>Graph ${M(Y+" = "+rhs)} by plotting points. Work down the table and plot each ${M(`(${X}, ${Y})`)} pair.</p>`);
    ctx.play().innerHTML=`<div class="split"><div id="gh"></div><div class="work"><table class="tbl"><thead><tr><th>${M(X)}</th><th>${M(Y+" = "+rhs)}</th></tr></thead><tbody>${xs.map((x,i)=>`<tr id="r${i}"><td>${M(num(x))}</td><td id="y${i}">?</td></tr>`).join("")}</tbody></table></div></div>`;
    const G=makeGrid($("#gh"),{xmin:-6,xmax:6,ymin:-10,ymax:10,U:22});
    let i=0;
    const mark=()=>xs.forEach((_,k)=>{$("#r"+k).className=k===i?"now":k<i?"done":"";});
    mark();
    G.pick((x,y)=>{
      const tx=xs[i],ty=ys[i];
      if(x===tx&&y===ty){
        $("#y"+i).innerHTML=M(sub(tx)+" = "+num(ty));G.point(x,y,"good");i++;mark();ctx.say("");
        if(i===xs.length){G.pick(null);G.line(xs[0],ys[0],xs[4],ys[4]);ctx.win(`All five points line up. The line through them is the graph of ${M(Y+" = "+rhs)}.`);}
      }else{
        flash(G.point(x,y,"bad"));
        ctx.miss(x!==tx?`This row uses ${M(X+" = "+num(tx))}. Plot the point straight above or below ${M(num(tx))} on the x-axis.`:`Substitute ${M(X+" = "+num(tx))}: ${M(Y+" = "+sub(tx))}. Work it out again.`);
      }
    });
  }
};

/* ---------- Station 3: intercepts (Ex 3–4) ---------- */
const S3={
  name:"Crossing Points",sec:"Intercepts",rounds:5,
  gen(r){
    for(;;){
      const p=nz(6),q=nz(6),si=r%2===1;
      if(si)return {p,q,si:true,m:R(-q,p)};
      const g=gcd(p,q),k=pick([1,-1,2]);
      const A=q/g*k,B=p/g*k,C=p*q/g*k;
      if(Math.max(Math.abs(A),Math.abs(B),Math.abs(C))>24)continue;
      return {p,q,si:false,A,B,C};
    }
  },
  round(r){
    const g=this.gen(r),{p,q,si}=g;
    const E=si?Y+" = "+siRHS(g.m,R(q)):eqStd(g.A,g.B,g.C);
    const cf=c=>Math.abs(c)===1?(c<0?MINUS:""):num(c);
    const setX=si?`0 = ${siRHS(g.m,R(q))}`:`${termV(g.A,X,true)}${g.B<0?` ${MINUS} `:" + "}${Math.abs(g.B)===1?"":Math.abs(g.B)}(0) = ${num(g.C)}`;
    const setY=si?`${Y} = ${g.m.d===1?cf(g.m.n):((g.m.n<0?MINUS:"")+fracH(String(Math.abs(g.m.n)),String(g.m.d)))}(0)${q<0?` ${MINUS} ${-q}`:` + ${q}`}`:`${cf(g.A)}(0)${termV(g.B,Y,false)} = ${num(g.C)}`;
    ctx.prompt(`<p>Find the intercepts of ${M(E)}. Tap the <b>${M(X)}-intercept</b> first, then the <b>${M(Y)}-intercept</b>.</p>`);
    ctx.play().innerHTML=`<div class="split"><div id="gh"></div><ol class="steps" id="steps"></ol></div>`;
    const G=makeGrid($("#gh"),{xmin:-7,xmax:7,ymin:-7,ymax:7});
    addStep("x-intercept",`<p>Where does the graph cross the ${M(X)}-axis? Tap it.</p>`);
    G.pick((x,y)=>{
      if(x===p&&y===0){
        G.point(p,0,"good",coordTxt(p,0),(p<0?"w":"e")+(q>0?"s":"n"));
        $("#steps li.on").insertAdjacentHTML("beforeend",`<p>${M(`${setX}`)}, so ${M(X+" = "+num(p))}. ${M(X)}-int ${M(coordTxt(p,0))}</p>`);
        ctx.say("");
        addStep("y-intercept",`<p>Now tap where it crosses the ${M(Y)}-axis.</p>`);
        G.pick((x2,y2)=>{
          if(x2===0&&y2===q){
            G.pick(null);G.point(0,q,"good",coordTxt(0,q),(p>0?"w":"e")+(q<0?"s":"n"));
            $("#steps li.on").insertAdjacentHTML("beforeend",`<p>${M(setY)}, so ${M(Y+" = "+num(q))}. ${M(Y)}-int ${M(coordTxt(0,q))}</p>`);
            G.line(p,0,0,q);
            ctx.win(`${M(E)} crosses the axes at ${M(coordTxt(p,0))} and ${M(coordTxt(0,q))}. Two intercepts are enough to draw the line.`);
          }else{
            flash(G.point(x2,y2,"bad"));
            ctx.miss(x2!==0?`A ${M(Y)}-intercept lies on the ${M(Y)}-axis, where ${M(X+" = 0")}. Set ${M(X+" = 0")}: ${M(setY)}. Solve for ${M(Y)}.`:`Set ${M(X+" = 0")}: ${M(setY)}. Solve for ${M(Y)}.`);
          }
        });
      }else{
        flash(G.point(x,y,"bad"));
        ctx.miss(x===0&&y===q?`That's the ${M(Y)}-intercept. The ${M(X)}-intercept is where the graph crosses the ${M(X)}-axis.`
          :y!==0?`An ${M(X)}-intercept lies on the ${M(X)}-axis, where ${M(Y+" = 0")}. Set ${M(Y+" = 0")}: ${M(setX)}. Solve for ${M(X)}.`
          :`Set ${M(Y+" = 0")}: ${M(setX)}. Solve for ${M(X)}.`);
      }
    });
  }
};

/* ---------- Station 4: distance (Ex 5–6) ---------- */
const S4={
  name:"Hypotenuse",sec:"Distance formula",rounds:5,
  gen(r){
    for(;;){
      let dx,dy;
      if(r===0)[dx,dy]=pick([[3,4],[4,3]]);
      else if(r===1)[dx,dy]=pick([[6,8],[8,6]]);
      else if(r===3)[dx,dy]=pick([[3,4],[4,3],[6,8],[8,6]]);
      else{dx=rnd(1,7);dy=rnd(1,7);const n=dx*dx+dy*dy,s=Math.round(Math.sqrt(n));if(s*s===n)continue;}
      dx*=pick([1,-1]);dy*=pick([1,-1]);
      const x1=rnd(Math.max(-8,-8-dx),Math.min(8,8-dx)),y1=rnd(Math.max(-8,-8-dy),Math.min(8,8-dy));
      const x2=x1+dx,y2=y1+dy;
      if(r>=3&&x1>=0&&y1>=0&&x2>=0&&y2>=0)continue;
      return {x1,y1,x2,y2};
    }
  },
  round(r){
    const {x1,y1,x2,y2}=this.gen(r),ax=Math.abs(x2-x1),ay=Math.abs(y2-y1),n=ax*ax+ay*ay;
    ctx.prompt(`<p>Find the distance between ${M(coordTxt(x1,y1))} and ${M(coordTxt(x2,y2))}.</p>`);
    ctx.play().innerHTML=`<div class="split"><div id="gh"></div><ol class="steps" id="steps"></ol></div>`;
    const G=makeGrid($("#gh"),{xmin:-9,xmax:9,ymin:-9,ymax:9,U:22});
    G.seg(x1,y1,x2,y2,"seg");
    G.point(x1,y1,"",coordTxt(x1,y1),(x1<x2?"w":"e")+(y1<y2?"s":"n"));
    G.point(x2,y2,"",coordTxt(x2,y2),(x2<x1?"w":"e")+(y2<y1?"s":"n"));
    addStep("Step 1 · Build the right triangle",`<p>The segment is the hypotenuse. Tap the grid point that makes the <b>right-angle corner</b>.</p>`);
    G.pick((x,y)=>{
      const ok=(x===x2&&y===y1)||(x===x1&&y===y2);
      if(!ok){flash(G.point(x,y,"bad"));return ctx.miss("The corner shares its x-coordinate with one point and its y-coordinate with the other.");}
      G.pick(null);
      const other1=x===x1?{x:x1,y:y1}:{x:x2,y:y2},other2=x===x1?{x:x2,y:y2}:{x:x1,y:y1};
      G.seg(x,y,other1.x,other1.y,"leg");G.seg(x,y,other2.x,other2.y,"leg");G.rightAngle(x,y,other2.x,other1.y);
      G.point(x,y,"target");
      G.tag((x+other2.x)/2,y,`|Δx| = ${ax}`,y>other1.y?"u":"d");
      G.tag(x,(y+other1.y)/2,`|Δy| = ${ay}`,x<other2.x?"l":"r");
      const s1=$("#steps li.on");
      s1.insertAdjacentHTML("beforeend",`<p>Legs: ${M(`|${X}<sub>2</sub> ${MINUS} ${X}<sub>1</sub>| = |${num(x2)} ${MINUS} ${pn(x1)}| = ${ax}`)} and ${M(`|${Y}<sub>2</sub> ${MINUS} ${Y}<sub>1</sub>| = |${num(y2)} ${MINUS} ${pn(y1)}| = ${ay}`)}</p>`);
      ctx.say("");
      const cands=shuffle([
        {v:String(ax+ay),why:`Square the legs before adding: ${M(`<i>d</i>${sup(2)} = <i>a</i>${sup(2)} + <i>b</i>${sup(2)}`)}.`},
        {v:String(n),why:`${M(String(n))} is ${M(`<i>d</i>${sup(2)}`)}. Take the square root to get ${M("<i>d</i>")}.`},
        {v:Math.abs(ax*ax-ay*ay)?radS(Math.abs(ax*ax-ay*ay)):"",why:`The squares of the legs <b>add</b>: ${M(`<i>a</i>${sup(2)} + <i>b</i>${sup(2)} = <i>d</i>${sup(2)}`)}.`}
      ]).filter(c=>c.v&&c.v!==radS(n)).slice(0,2);
      const li=addStep("Step 2 · Pythagorean theorem",`<p>${M(`<i>d</i>${sup(2)} = ${ax}${sup(2)} + ${ay}${sup(2)}`)}. What is ${M("<i>d</i>")}?</p><div class="opts"></div>`);
      choose($(".opts",li),[{h:M(radS(n)),ok:true}].concat(cands.map(c=>({h:M(c.v),ok:false,why:c.why}))),()=>{
        ctx.win(M(`<i>d</i> = √<span class="rad">(${num(x2)} ${MINUS} ${pn(x1)})${sup(2)} + (${num(y2)} ${MINUS} ${pn(y1)})${sup(2)}</span> = √<span class="rad">${ax*ax} + ${ay*ay}</span> = ${radS(n)}`)+" units");
      });
    });
  }
};

/* ---------- Station 5: midpoint (Ex 7–8) ---------- */
const half=v=>Number.isInteger(v)?num(v):`${num(v)}`;
const S5={
  name:"Halfway",sec:"Midpoint formula",rounds:5,
  gen(r){
    for(;;){
      const x1=rnd(-8,8),y1=rnd(-8,8);let x2=rnd(-8,8),y2=rnd(-8,8);
      if(r===3){if(Math.random()<.5)y2=y1;else x2=x1;}
      if(Math.hypot(x2-x1,y2-y1)<4)continue;
      const hasHalf=(x1+x2)%2!==0||(y1+y2)%2!==0;
      if(r===0&&hasHalf)continue;
      if((r===1||r===2||r===4)&&!hasHalf)continue;
      const circle=r>=3;
      if(circle){const rad=Math.hypot(x2-x1,y2-y1)/2,cx=(x1+x2)/2,cy=(y1+y2)/2;if(cx-rad<-9||cx+rad>9||cy-rad<-9||cy+rad>9)continue;}
      return {x1,y1,x2,y2,circle};
    }
  },
  round(r){
    const {x1,y1,x2,y2,circle}=this.gen(r),mx=(x1+x2)/2,my=(y1+y2)/2;
    ctx.prompt(circle?`<p>A diameter of a circle has endpoints ${M(coordTxt(x1,y1))} and ${M(coordTxt(x2,y2))}. Tap the <b>center</b> of the circle.</p>`
      :`<p>Tap the midpoint of the segment from ${M(coordTxt(x1,y1))} to ${M(coordTxt(x2,y2))}. Half-grid points count.</p>`);
    ctx.play().innerHTML=`<div id="gh"></div>`;
    const G=makeGrid($("#gh"),{xmin:-9,xmax:9,ymin:-9,ymax:9,U:22,snap:.5});
    G.seg(x1,y1,x2,y2,"seg");
    G.point(x1,y1,"",coordTxt(x1,y1),(x1<=x2?"w":"e")+(y1<y2?"s":"n"));
    G.point(x2,y2,"",coordTxt(x2,y2),(x2<x1?"w":"e")+(y2<y1?"s":"n"));
    const work=`M = (${fracH(`${num(x1)} + ${pn(x2)}`,"2")}, ${fracH(`${num(y1)} + ${pn(y2)}`,"2")})`;
    const sumX=x1+x2,sumY=y1+y2;
    G.pick((x,y)=>{
      if(x===mx&&y===my){
        G.pick(null);G.point(mx,my,"target",`M ${coordTxt(mx,my)}`,"ne");
        if(circle)G.circle(mx,my,Math.hypot(x2-x1,y2-y1)/2);
        ctx.win(`${M(`${work} = (${fracH(num(sumX),"2")}, ${fracH(num(sumY),"2")}) = ${coordTxt(mx,my)}`)}${circle?". The center of a circle is the midpoint of any diameter.":""}`);
      }else{
        flash(G.point(x,y,"bad"));
        ctx.miss(`That's ${M(coordTxt(x,y))}. The midpoint averages the coordinates: ${M(work)}.`);
      }
    });
  }
};

/* ---------- Station 6: quadrant speed round ---------- */
const S6={
  name:"Quadrant Rush",sec:"Speed round",rounds:1,
  round(){
    const KEYS=["I","II","III","IV","x-axis","y-axis"];
    ctx.prompt(`<p>60 seconds. Read each point and choose where it lies. Keys 1 to 6 work too. Scores of 5, 10 and 15 earn one, two and three stars.</p>`);
    ctx.play().innerHTML=`<div class="speed"><div class="timer"><div class="bar" id="bar"></div></div>
      <div class="speed-top"><span id="clock">60.0 s</span><span id="score">Score 0</span></div>
      <p class="claim m" id="claim">(${MINUS}4, 2)</p>
      <div class="choices" id="choices">${KEYS.map((k,i)=>`<button type="button" class="choice" data-k="${k}" disabled><kbd>${i+1}</kbd> ${QLABEL[k]}</button>`).join("")}</div></div>`;
    $("#actions").innerHTML=`<button type="button" class="btn primary" id="start">Start the clock</button>`;
    ctx.say(`Sample: ${M(`(${MINUS}4, 2)`)} has negative ${M(X)} and positive ${M(Y)}, so it is in Quadrant II.`);
    let score=0,seen=0,cur=null,locked=true,t0=0,tick=null,wait=null,running=false;
    const btns=[...ctx.play().querySelectorAll(".choice")];
    function next(){
      let p;do{p={x:rnd(-9,9),y:rnd(-9,9)};if(Math.random()<.2){if(Math.random()<.5)p.x=0;else p.y=0;}}while((p.x===0&&p.y===0)||(cur&&p.x===cur.x&&p.y===cur.y));
      cur=p;$("#claim").textContent=coordTxt(p.x,p.y);locked=false;btns.forEach(b=>{b.disabled=false;});
    }
    function end(){
      running=false;clearInterval(tick);clearTimeout(wait);
      const st=score>=15?3:score>=10?2:score>=5?1:0;
      finish(st,`You placed ${score} of ${seen} points correctly in 60 seconds.${st<3?" Reach 15 for three stars.":""}`);
    }
    function answer(k){
      if(locked||!running)return;
      locked=true;btns.forEach(b=>{b.disabled=true;});seen++;
      const ok=k===quadOf(cur.x,cur.y);
      if(ok){score++;$("#score").textContent=`Score ${score}`;ctx.say(`✓ ${M(coordTxt(cur.x,cur.y))} ${locStr(cur)}.`,"good");}
      else ctx.say(`✗ ${quadWhy(cur)}`,"bad");
      wait=setTimeout(next,ok?500:1800);
    }
    $("#start").onclick=()=>{
      $("#actions").innerHTML="";ctx.say("");running=true;t0=performance.now();
      tick=setInterval(()=>{
        const left=Math.max(0,60-(performance.now()-t0)/1000);
        $("#clock").textContent=left.toFixed(1)+" s";$("#bar").style.transform=`scaleX(${left/60})`;
        if(left<=0)end();
      },100);
      next();
    };
    $("#choices").addEventListener("click",e=>{const b=e.target.closest(".choice");if(b)answer(b.dataset.k);});
    S.key=e=>{const k=KEYS[+e.key-1];if(k)answer(k);};
    S.cleanup=()=>{running=false;clearInterval(tick);clearTimeout(wait);};
  }
};

const STATIONS=[S1,S2,S3,S4,S5,S6];
$("#rail").addEventListener("click",e=>{const b=e.target.closest(".st-btn");if(b)loadStation(+b.dataset.i);});
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(S.key)S.key(e);});
let armed=false;
$("#reset").onclick=e=>{
  if(!armed){armed=true;e.target.textContent="Tap again to erase all stars";setTimeout(()=>{armed=false;e.target.textContent="Reset stars";},4000);return;}
  best={};store.set(best);armed=false;e.target.textContent="Stars reset";renderNav();
};
renderNav();startRound();
})();
</script>
